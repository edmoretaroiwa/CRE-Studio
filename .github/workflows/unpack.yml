name: Unpack upload
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, 'Unpack') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q "$ZIP" -d /tmp/x
          SRC=$(dirname "$(find /tmp/x -name settings.gradle.kts | head -n 1)")
          if [ ! -f "$SRC/app/src/main/java/com/cre/studio/ui/Components3D.kt" ]; then
            echo "This zip is the OLD prototype. Upload CRE-Studio-v1.zip instead."
            exit 1
          fi
          rm -rf "$SRC/.git" "$SRC/.github"
          cp -r "$SRC"/. .
          rm -f *.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack CRE Studio 1.0"
          git push
