name: Unpack upload
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
permissions:
  contents: write
  workflows: write # Add this to prevent push rejections for .github changes

jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, 'Unpack') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No zip file found!"
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q "$ZIP" -d /tmp/x
          
          # Safer way to find the root directory
          SETTINGS_FILE=$(find /tmp/x -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
             echo "settings.gradle.kts not found in the zip!"
             exit 1
          fi
          SRC=$(dirname "$SETTINGS_FILE")
          
          # Your specific check
          if [ ! -f "$SRC/app/src/main/java/com/cre/studio/ui/Components3D.kt" ]; then
            echo "This zip is the OLD prototype. Upload the correct zip."
            exit 1
          fi
          
          rm -rf "$SRC/.git" "$SRC/.github"
          cp -r "$SRC"/. .
          rm -f *.zip
          
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          # Check if there are changes before committing to avoid failure
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unpack CRE Studio 1.0"
            git push
          fi
