name: Unpack upload
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
permissions:
  contents: write
  workflows: write # Crucial to prevent push errors

jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, 'Unpack') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip and Check
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No zip file found!"
            exit 1
          fi
          
          echo "Using $ZIP"
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q "$ZIP" -d /tmp/x
          
          # Find the root of the project
          SETTINGS_FILE=$(find /tmp/x -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
             echo "Error: settings.gradle.kts not found!"
             exit 1
          fi
          
          SRC=$(dirname "$SETTINGS_FILE")
          echo "Found source directory at: $SRC"
          
          # Clean up any git history inside the extracted folder
          rm -rf "$SRC/.git" "$SRC/.github"
          
          # Copy everything to the root
          cp -r "$SRC"/. .
          
          # Delete the zip so it doesn't trigger the workflow infinitely
          rm -f *.zip
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unpack CRE Studio source code"
            git push
          fi
