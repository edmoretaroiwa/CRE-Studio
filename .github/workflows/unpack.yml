name: Unpack upload
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
permissions:
  contents: write
  workflows: write # Crucial for pushing changes to .github

jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, 'Unpack') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip and Check
        run: |
          # Find the zip file safely
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No zip file found!"
            exit 1
          fi
          
          echo "Using $ZIP"
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q "$ZIP" -d /tmp/x
          
          echo "--- Contents of /tmp/x ---"
          ls -la /tmp/x
          
          # Find the settings.gradle.kts to locate the root
          SETTINGS_FILE=$(find /tmp/x -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
             echo "settings.gradle.kts not found in the zip!"
             exit 1
          fi
          
          SRC=$(dirname "$SETTINGS_FILE")
          echo "Found source directory at: $SRC"
          echo "--- Contents of $SRC ---"
          ls -la "$SRC"
          
          # Remove git history of the unzipped folder if it exists
          rm -rf "$SRC/.git" "$SRC/.github"
          
          # Copy everything including hidden files
          cp -r "$SRC"/. .
          
          # Delete the zip so it doesn't trigger the workflow again
          rm -f *.zip
          
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unpack CRE Studio"
            git push
          fi
