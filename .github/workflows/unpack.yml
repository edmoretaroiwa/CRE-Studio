name: Unpack upload
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
permissions:
  contents: write
  workflows: write # THIS IS CRUCIAL. Prevents push rejection.

jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, 'Unpack') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip and Check
        run: |
          # 1. Find the zip file
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Error: No zip file found in root!"
            exit 1
          fi
          
          echo "Using $ZIP"
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q "$ZIP" -d /tmp/x
          
          # 2. Print contents for debugging
          echo "--- Contents of unzipped directory ---"
          ls -la /tmp/x
          
          # 3. Find the Gradle root
          SETTINGS_FILE=$(find /tmp/x -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
             echo "Error: settings.gradle.kts not found inside the zip!"
             exit 1
          fi
          
          SRC=$(dirname "$SETTINGS_FILE")
          echo "Found source directory at: $SRC"
          
          # 4. Remove git history from the extracted folder
          rm -rf "$SRC/.git" "$SRC/.github"
          
          # 5. Copy everything to the root of the repo
          cp -r "$SRC"/. .
          
          # 6. Delete the zip so it doesn't trigger again
          rm -f *.zip
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unpack CRE Studio source code"
            git push
          fi
