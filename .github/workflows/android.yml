name: Build CRE Studio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # --- THIS IS THE DEBUG STEP ---
    - name: Debug - List all files
      run: |
        echo "Current Directory: $(pwd)"
        echo "--- Files in Root ---"
        ls -la
        echo "--- Searching for settings.gradle.kts ---"
        find . -name "settings.gradle.kts"
    # ------------------------------

    - name: Build Android APK
      # If the Debug step shows the files are inside a folder named 'CRE-Studio', uncomment the next line:
      # working-directory: ./CRE-Studio
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CRE-Studio-debug
        path: "**/build/outputs/apk/debug/*.apk"